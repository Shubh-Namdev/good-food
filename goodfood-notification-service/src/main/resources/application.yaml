spring:
  application:
    name: goodfood-notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/goodfood_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # change to validate in production
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVER_IP}:9092

    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SENDER_EMAIL}
    password: ${SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9000

notification:
  processing-timeout-minutes: 5

# management:
#   endpoints:
#     web:
#       exposure:
#         include: health,info,metrics,prometheus

logging:
  level:
    org.springframework.kafka: INFO
    com.goodfood: DEBUG